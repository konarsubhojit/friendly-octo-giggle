# Self-hosted stack for `DEPLOY_TARGET=self-hosted`.
#
# Topology matches `docs/kamatera-deployment.md`: app, postgres, redis and
# minio bind to `127.0.0.1` only, and the reverse proxy is the single public
# listener. Do not publish any other port on the VM's public interface.
#
#   docker compose --env-file deploy/.env.selfhost \
#     -f deploy/docker-compose.yml up -d
#
# `--env-file` is not optional. Compose interpolates `${...}` from the project
# environment *before* any service `env_file` is read, so without it `APP_IMAGE`
# keeps its placeholder and the required credentials below abort the command.
#
# `deploy/.env.selfhost` is git-ignored — copy `.env.selfhost.example` to
# create it. This repository is public; never commit real values.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/OWNER/REPO:latest}
    restart: unless-stopped
    # `required: false` so the file may also be supplied from elsewhere (the
    # systemd install puts it at `/etc/octo/app.env`) without making this a
    # hard error. It is still what populates the container's environment:
    # `--env-file` above only feeds `${...}` interpolation.
    env_file:
      - path: .env.selfhost
        required: false
    # Host networking, like `caddy` below, so that the single `.env.selfhost`
    # is valid for both process models: its `DATABASE_URL`, `REDIS_URL`, and
    # `S3_ENDPOINT` all name `127.0.0.1`, which on a bridge network would be
    # the app container itself rather than `postgres`, `redis`, or `minio`.
    # Those services publish on the host's loopback interface, so sharing the
    # host namespace makes the loopback URLs resolve exactly as they do under
    # the systemd units.
    network_mode: host
    environment:
      NODE_ENV: production
      DEPLOY_TARGET: self-hosted
      PORT: 3000
      # Bind to loopback only — with host networking, `0.0.0.0` would publish
      # the app on the VM's public interface, bypassing the proxy.
      HOSTNAME: 127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1536m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octo}
      # Required, with no default: a fixed fallback password would mean a
      # missed secret silently brings up a database whose credentials are
      # published in this repository. `:?` fails the command instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.selfhost}
      POSTGRES_DB: ${POSTGRES_DB:-octo}
    ports:
      - '127.0.0.1:5432:5432' # loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-octo}']
      interval: 5s
      timeout: 5s
      retries: 10
    # `shared_buffers` should be ~25% of this ceiling, not of the VM's total RAM.
    mem_limit: 1024m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache and mirror data only, never authoritative — so an LRU eviction
    # policy is correct and losing the dataset costs a cold cache, nothing more.
    command: >-
      redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
      --save 60 1000
    ports:
      - '127.0.0.1:6379:6379' # loopback only
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Required for the same reason as POSTGRES_PASSWORD above.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env.selfhost}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env.selfhost}
    ports:
      - '127.0.0.1:9000:9000' # S3 API — reachable only through the app
      - '127.0.0.1:9001:9001' # console — reach it over an SSH tunnel
    volumes:
      - miniodata:/data
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only service with a public listener. :80 must stay open for the
    # Let's Encrypt HTTP-01 challenge and the http → https redirect.
    # `network_mode: host` is what lets `reverse_proxy 127.0.0.1:3000` in the
    # Caddyfile reach the app's loopback-published port.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
