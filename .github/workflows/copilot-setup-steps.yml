name: 'Copilot Setup Steps'
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Must match the Node version used by build.yml and
          # build-self-hosted.yml, otherwise the agent validates changes on a
          # different runtime than the one that gates the pull request.
          node-version: '24'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci
