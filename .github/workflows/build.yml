name: Build
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  test:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Documentation drift check
        run: npm run docs:check

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.check.json

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

  # Proves the self-hosted provider profile (Postgres, node-redis, S3/MinIO)
  # against real disposable services instead of mocks -- the opt-in suites
  # these services activate are skipped in the `test` job above because no
  # *_TEST_* env vars are set there. See docs/self-hosting.md#ci-provider-matrix.
  provider-matrix:
    name: Provider Matrix (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_USER: octo
      PG_PASSWORD: octo
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: octo
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: provider-matrix-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # MinIO's image needs `server /data` on its command line, which the
      # `services:` block cannot supply (it only starts a container's default
      # CMD), so it is started as a plain, manually-managed container instead.
      - name: Start disposable MinIO and create the test bucket
        run: |
          docker run -d --name minio-ci -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host \
            -e "MC_HOST_ci=http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000" \
            minio/mc mb "ci/$MINIO_BUCKET"

      - name: Apply database migrations to the disposable Postgres
        run: |
          export DATABASE_URL="postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}"
          npm run db:migrate

      - name: Run opt-in provider integration suites
        run: |
          export RESERVATION_TEST_DATABASE_URL="postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}"
          export CACHE_TEST_REDIS_URL="redis://localhost:6379"
          export STORAGE_TEST_S3_ENDPOINT="http://localhost:9000"
          export STORAGE_TEST_S3_BUCKET="$MINIO_BUCKET"
          export STORAGE_TEST_S3_ACCESS_KEY_ID="$MINIO_ROOT_USER"
          export STORAGE_TEST_S3_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD"
          export STORAGE_TEST_S3_REGION="us-east-1"
          export STORAGE_TEST_S3_PUBLIC_BASE_URL="http://localhost:9000/$MINIO_BUCKET"
          npx vitest run \
            __tests__/features/orders/services/stock-reservation.integration.test.ts \
            __tests__/lib/cache/redis-integration.test.ts \
            __tests__/lib/storage/s3-integration.test.ts

      - name: Stop disposable MinIO
        if: always()
        run: docker rm -f minio-ci || true
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Key on the inputs that actually invalidate compilation — the lockfile
      # and the Next.js config. Hashing every source file made the key change
      # on every commit, so the exact-match restore never hit and a fresh
      # ~350 MB entry was saved on every run; `restore-keys` supplies the
      # prefix fallback. `.next/cache` covers `.next/cache/turbopack`.
      # Turbopack validates its own entries and falls back to a cold build when
      # they are incompatible, which is what makes a looser key safe.
      # The save step below must use this exact key or restore can never hit.
      - name: Restore Next.js build cache
        id: restore-nextjs-cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://localhost/ci_placeholder
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1

      - name: Save Next.js build cache
        if: always() && hashFiles('.next/cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts') }}

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-report
          path: coverage

      - name: Verify coverage report is present
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info is missing or empty. The 'Lint, Type Check and Test' job must publish the coverage-report artifact before SonarQube can report accurate new-code coverage."
            exit 1
          fi

      # sonar.coverage.exclusions below is limited to framework-owned route
      # entrypoints (page/layout/loading/error), declarative schema, and
      # config-like bootstrap modules (db, env, redis, logger, email provider
      # wiring, constant tables) plus type-only declarations. Security-relevant
      # sources such as src/proxy.ts and src/lib/search/** are intentionally NOT
      # excluded so the security perimeter stays covered and scanned.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/lib/schema.ts,src/lib/db.ts,src/lib/env.ts,src/lib/redis.ts,src/lib/logger.ts,src/lib/email/providers.ts,src/lib/constants/categories.ts,src/lib/constants/checkout-policies.ts,src/types/**

  deepsource:
    name: DeepSource Analysis
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-report
          path: coverage

      - name: Report coverage to DeepSource
        run: |
          curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh
          ./bin/deepsource report --analyzer test-coverage --key javascript --value-file coverage/lcov.info --use-oidc

  codecov:
    name: Codecov Upload
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-report
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # Migrations must complete before the new code is deployed, otherwise the new
  # revision serves traffic against the old schema. Migrations must therefore be
  # written expand/contract style so the currently deployed (old) code keeps
  # working against the new schema. See docs/deployment.md#database-migrations.
  database-migrations-preview:
    name: Run Database Migrations (Preview)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel preview environment and run migrations
        run: |
          npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          cp .vercel/.env.preview.local .env.local
          npm run db:migrate
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  database-migrations-production:
    name: Run Database Migrations (Production)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment and run migrations
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          cp .vercel/.env.production.local .env.local
          npm run db:migrate
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    needs: [database-migrations-preview]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Vercel Preview
        run: npx --yes vercel@latest deploy --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: [database-migrations-production]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Vercel Production
        run: npx --yes vercel@latest deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
